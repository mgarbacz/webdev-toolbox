<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,interactive-widget=resizes-content"
  />
  <title>Floating Input Label</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <form action="">
    <div class="form-control">
      <input
        name="form-first-name"
        type="text"
        spellcheck="false"
        maxlength="35"
        placeholder
        required
      />
      <label for="form-first-name">First Name</label>
    </div>
    <div class="form-control">
      <input
        name="form-last-name"
        type="text"
        spellcheck="false"
        maxlength="35"
        placeholder
        required
      />
      <label for="form-last-name">Last Name</label>
    </div>
    <div class="form-control">
      <input
        name="form-email"
        type="email"
        spellcheck="false"
        placeholder
        required
      />
      <label for="form-email">Email</label>
    </div>
    <button class="form-button">Submit</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
